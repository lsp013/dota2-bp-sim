<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dota 2 BP 模拟器</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <h1>Dota 2 <span>BP 模拟器</span></h1>
  <button id="metaBtn" class="meta-btn" type="button" aria-label="数据信息">数据</button>
</header>

<div id="metaPanel" class="meta-panel" hidden></div>

<div id="loading" class="loading">正在加载数据…</div>

<main id="app" hidden>
  <section class="controls">
    <div class="weight-row">
      <label>克制 <output id="wCounterOut">70%</output>
        <input type="range" id="wCounter" min="0" max="100" value="70">
      </label>
      <label>协同 <output id="wSynergyOut">20%</output>
        <input type="range" id="wSynergy" min="0" max="100" value="20">
      </label>
      <label>版本强度 <output id="wBaseOut">10%</output>
        <input type="range" id="wBase" min="0" max="100" value="10">
      </label>
    </div>
    <div class="weight-row">
      <label class="min-games">最小样本
        <select id="minGames">
          <option value="30" selected>30 场</option>
          <option value="50">50 场</option>
          <option value="100">100 场</option>
        </select>
      </label>
      <button id="resetBtn" class="btn danger" type="button">重置 BP</button>
    </div>
  </section>

  <section class="teams">
    <div class="team ours" id="teamOur" data-drop="our">
      <h2>我方 <span id="ourCount">0</span>/5</h2>
      <div id="ourSlots" class="slots"></div>
    </div>
    <div class="team theirs" id="teamEnemy" data-drop="enemy">
      <h2>敌方 <span id="enemyCount">0</span>/5</h2>
      <div id="enemySlots" class="slots"></div>
    </div>
  </section>

  <section class="panels">
    <div class="panel" id="poolPanel" data-drop="pool">
      <h3>英雄池</h3>
      <div class="pool-head">
        <input type="search" id="search" placeholder="搜索英雄…" autocomplete="off">
        <div class="side-toggle" id="sideToggle" role="group" aria-label="点击英雄加入哪一方">
          <button type="button" data-side="our" aria-pressed="false">加入我方</button>
          <button type="button" data-side="enemy" class="active" aria-pressed="true">加入敌方</button>
        </div>
      </div>
      <p class="hint">
        点按加入所选一方 · 也可以直接把英雄<b>拖到</b>上方我方/敌方栏位（拖回这里可移除）
      </p>
      <div id="pool" class="pool"></div>
    </div>

    <div class="panel" id="recsPanel">
      <h3>推荐选人</h3>
      <p class="hint">综合「克制 + 协同 + 版本强度」，小样本自动向 50% 收缩。点按查看依据。</p>
      <div id="recs" class="recs"></div>
    </div>
  </section>
</main>

<div id="sourceNote" class="source-note" hidden></div>

<div class="source-fab" id="sourceFab" role="group" aria-label="数据源">
  <button type="button" data-source="opendota" aria-pressed="false"
          title="OpenDota：滚动近期窗口，全分段，单对位样本中位约 47 场">OpenDota</button>
  <button type="button" data-source="stratz" aria-pressed="false"
          title="STRATZ：一周数据，已校准分段，单对位样本中位约 2000 场">STRATZ</button>
  <button type="button" data-source="both" class="active" aria-pressed="true"
          title="两者合并（默认）：逐对位把场次与胜场相加，大样本占主导">合并</button>
</div>

<div id="detail" class="sheet" hidden>
  <div class="sheet-inner">
    <button id="detailClose" class="sheet-close" type="button" aria-label="关闭">×</button>
    <div id="detailBody"></div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
